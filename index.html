<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Clean YouTube</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 12px;
    }
    h1 { font-size: 1.1rem; margin-bottom: 12px; }
    button {
      background-color: #cc0000;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .video-card {
      background-color: #1e1e1e;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .video-item-header {
      display: flex;
      gap: 12px;
      padding: 8px;
      align-items: center;
      cursor: pointer;
    }
    .video-item-header:hover {
      background-color: #2a2a2a;
    }
    .video-item-header img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #ffffff;
    }
    .channel-name { font-size: 0.75rem; color: #aaa; }
    
    /* 16:9の埋め込みプレイヤー枠 */
    .player-container {
      display: none;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background: #000;
    }
    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #login-section, #app-section { display: none; }
    #debug-box {
      background: #333;
      color: #ff8888;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="login-section">
    <h1>My Clean YouTube</h1>
    <p>登録チャンネル専用の省誘惑プレイヤーです。</p>
    <button id="login-btn">Googleで安全にログイン</button>
  </div>

  <div id="app-section">
    <h1>新着動画一覧</h1>
    <div id="video-list">読み込み中...</div>
    <div id="debug-box" style="display:none;"></div>
    <br>
    <button id="logout-btn" style="background-color: #444;">ログアウト</button>
  </div>

  <script>
    const CLIENT_ID = '646094903557-65ut9st2226pkc2gcme8m7hd18ssg1jn.apps.googleusercontent.com';
    const REDIRECT_URI = 'https://turkyudar.github.io/my-youtube-app/';
    const SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';

    window.onload = () => {
      let token = localStorage.getItem('yt_access_token');
      const hash = window.location.hash;
      if (hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        token = params.get('access_token');
        localStorage.setItem('yt_access_token', token);
        window.location.hash = '';
      }

      if (token) {
        showAppSection();
        loadSubscribedVideos(token);
      } else {
        document.getElementById('login-section').style.display = 'block';
      }
    };

    document.getElementById('login-btn').onclick = () => {
      const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPE)}`;
      window.location.href = authUrl;
    };

    document.getElementById('logout-btn').onclick = () => {
      localStorage.removeItem('yt_access_token');
      location.reload();
    };

    function showAppSection() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('app-section').style.display = 'block';
    }

    function showError(msg) {
      const box = document.getElementById('debug-box');
      box.style.display = 'block';
      box.innerText = msg;
    }

    async function loadSubscribedVideos(token) {
      const videoListDiv = document.getElementById('video-list');
      try {
        // 1. 登録チャンネル一覧を取得
        const subRes = await fetch('https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=15', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const subData = await subRes.json();

        if (subData.error) {
          showError('APIエラー[subscriptions]: ' + JSON.stringify(subData.error, null, 2));
          videoListDiv.innerHTML = '登録チャンネルの取得に失敗しました。';
          return;
        }

        const channelIds = (subData.items || []).map(item => item.snippet.resourceId.channelId);

        if (channelIds.length === 0) {
          videoListDiv.innerHTML = '登録チャンネルが見つかりませんでした。';
          return;
        }

        // 2. アップロード動画再生リストIDを取得
        const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelIds.join(',')}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const chData = await chRes.json();

        if (chData.error) {
          showError('APIエラー[channels]: ' + JSON.stringify(chData.error, null, 2));
          videoListDiv.innerHTML = 'チャンネル詳細の取得に失敗しました。';
          return;
        }

        const playlistIds = (chData.items || []).map(ch => ch.contentDetails?.relatedPlaylists?.uploads).filter(Boolean);

        // 3. 再生リストから最新動画を取得
        const playlistPromises = playlistIds.map(plId =>
          fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails,snippet&playlistId=${plId}&maxResults=3`, {
            headers: { Authorization: `Bearer ${token}` }
          }).then(r => r.json())
        );
        const playlistResults = await Promise.all(playlistPromises);

        let rawVideoIds = [];
        playlistResults.forEach(data => {
          if (data.items) {
            data.items.forEach(item => {
              const vId = item.contentDetails?.videoId;
              if (vId) rawVideoIds.push(vId);
            });
          }
        });

        if (rawVideoIds.length === 0) {
          videoListDiv.innerHTML = '新着動画が見つかりませんでした。';
          return;
        }

        const videoIdsList = Array.from(new Set(rawVideoIds)).slice(0, 30);

        // 4. 動画の詳細情報を取得
        const detailsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${videoIdsList.join(',')}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const detailsData = await detailsRes.json();

        if (detailsData.error) {
          showError('APIエラー[videos]: ' + JSON.stringify(detailsData.error, null, 2));
          videoListDiv.innerHTML = '動画詳細の取得に失敗しました。';
          return;
        }

        let fetchedVideos = detailsData.items || [];

        // 日付順（新しい順）にソート
        fetchedVideos.sort((a, b) => new Date(b.snippet.publishedAt) - new Date(a.snippet.publishedAt));

        // 5. 配信予定枠などの未公開コンテンツのみ除外
        const validVideos = fetchedVideos.filter(video => {
          const liveState = video.snippet?.liveBroadcastContent;
          return !liveState || liveState === 'none' || liveState === 'live';
        });

        if (validVideos.length === 0) {
          videoListDiv.innerHTML = '表示できる動画がありません。';
          return;
        }

        // 描画処理
        videoListDiv.innerHTML = validVideos.map(video => `
          <div class="video-card">
            <div class="video-item-header" onclick="playVideo('${video.id}')">
              <img src="${video.snippet.thumbnails.medium?.url || video.snippet.thumbnails.default?.url}" alt="${video.snippet.title}">
              <div class="video-info">
                <div class="video-title">${video.snippet.title}</div>
                <div class="channel-name">${video.snippet.channelTitle}</div>
              </div>
            </div>
            <div id="player-${video.id}" class="player-container"></div>
          </div>
        `).join('');

      } catch (err) {
        showError('通信・JSエラー: ' + err.message);
        videoListDiv.innerHTML = '処理中にエラーが発生しました。';
      }
    }

    // アプリ内プレイヤー展開（youtube-nocookie ドメインを使用）
    function playVideo(videoId) {
      const container = document.getElementById(`player-${videoId}`);
      if (container.style.display === 'block') {
        container.style.display = 'none';
        container.innerHTML = '';
      } else {
        document.querySelectorAll('.player-container').forEach(el => {
          el.style.display = 'none';
          el.innerHTML = '';
        });
        container.style.display = 'block';
        container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }
    }
  </script>
</body>
</html>
